name: Build plugin candidates
on:
  workflow_dispatch:
  push:
    branches: ["codex/integration-*"]
permissions:
  contents: write
concurrency:
  group: plugin-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    name: Classify integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      context_only: ${{ steps.classify.outputs.context_only }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: classify
        run: python3 scripts/validate_context.py --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/classification.json"
  context:
    name: Validate context records
    needs: classify
    if: needs.classify.outputs.context_only == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      GH_TOKEN: ${{ github.token }}
      EXPECTED_BASE: ${{ needs.classify.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: context-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            candidate-x86_64-unknown-linux-gnu-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - run: cargo fetch --locked
      - run: ./scripts/install-git-hooks
      - run: python3 scripts/validate_context.py --base "$EXPECTED_BASE" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/CONTEXT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: context-validation
          path: ${{ runner.temp }}/CONTEXT.json
  candidate:
    name: Candidate (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.context_only == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: macos-26
            label: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      EXPECTED_BASE: ${{ needs.classify.outputs.base }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/validate --scope preflight --output "$RUNNER_TEMP/preflight"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: candidate-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            candidate-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            candidate-${{ matrix.target }}-1.99.1-
      - run: cargo fetch --locked
      - run: ./scripts/install-git-hooks
      - run: TMPDIR=/tmp ./scripts/validate --integration-base "$EXPECTED_BASE" --output "$RUNNER_TEMP/validation"
      - run: cargo build --locked --offline --example dev_fixture
      - run: |
          gh auth setup-git
          ./scripts/release candidate --local --save-only --target "${{ matrix.target }}" --repository "${{ github.repository }}" --fixture target/debug/examples/dev_fixture --startup-report "$RUNNER_TEMP/validation/STARTUP.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.label }}
          path: ${{ runner.temp }}/validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/transfer-feedback/
            ${{ runner.temp }}/preflight/
  publish:
    name: Finalize candidate
    needs: candidate
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: |
          gh auth setup-git
          ./scripts/release candidate --finalize --repository "${{ github.repository }}"
  gate:
    name: Candidate gate
    if: always()
    needs: [classify, context, candidate, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the complete validation path
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CONTEXT_ONLY: ${{ needs.classify.outputs.context_only }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$CONTEXT_ONLY" = true ]; then
            test "$CONTEXT_RESULT" = success
            test "$CANDIDATE_RESULT" = skipped
            test "$PUBLISH_RESULT" = skipped
          else
            test "$CONTEXT_ONLY" = false
            test "$CONTEXT_RESULT" = skipped
            test "$CANDIDATE_RESULT" = success
            test "$PUBLISH_RESULT" = success
          fi
