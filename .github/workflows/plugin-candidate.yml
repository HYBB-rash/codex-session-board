name: Build plugin candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: cargo fetch --locked
      - run: ./scripts/install-git-hooks && ./scripts/check
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - run: python3 scripts/verify_acceptance.py --scope automated --report "$RUNNER_TEMP/automated.json"
      - run: bash scripts/build-plugin --output "$RUNNER_TEMP/plugin"
      - run: |
          gh auth setup-git
          python3 scripts/publish_plugin.py --repository "https://github.com/${{ github.repository }}.git" --package "$RUNNER_TEMP/plugin" --channel candidate
        env:
          GH_TOKEN: ${{ github.token }}
      - run: tar -czf "$RUNNER_TEMP/plugin-${{ matrix.label }}.tar.gz" -C "$RUNNER_TEMP/plugin" .
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/plugin-${{ matrix.label }}.tar.gz
            ${{ runner.temp }}/automated.json
