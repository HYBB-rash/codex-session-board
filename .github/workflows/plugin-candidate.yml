name: Build plugin candidates
on:
  workflow_dispatch:
  push:
    branches: ["codex/integration-*"]
permissions:
  contents: write
concurrency:
  group: plugin-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Candidate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: macos-26
            label: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/validate --scope preflight --output "$RUNNER_TEMP/preflight"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: candidate-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            candidate-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            candidate-${{ matrix.target }}-1.99.1-
      - run: cargo fetch --locked
      - run: ./scripts/install-git-hooks
      - run: TMPDIR=/tmp node scripts/check-transfer-feedback.mjs "$RUNNER_TEMP/transfer-feedback"
      - run: TMPDIR=/tmp ./scripts/validate --output "$RUNNER_TEMP/validation"
      - run: |
          gh auth setup-git
          ./scripts/release candidate --local --save-only --target "${{ matrix.target }}" --repository "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.label }}
          path: ${{ runner.temp }}/validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/transfer-feedback/
            ${{ runner.temp }}/preflight/
  publish:
    name: Finalize candidate
    needs: candidate
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: |
          gh auth setup-git
          ./scripts/release candidate --finalize --repository "${{ github.repository }}"
  gate:
    name: Candidate gate
    if: always()
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every validation and publication job
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: test "$CANDIDATE_RESULT" = success && test "$PUBLISH_RESULT" = success
