name: Publish main plugins
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      exercise_failure:
        type: boolean
        default: false
        description: Fail before publication to verify the previous channels remain usable
      exercise_hold_seconds:
        type: choice
        default: "0"
        options: ["0", "120", "300"]
        description: Hold before publication for the continuous-main-update exercise
permissions:
  contents: read
  actions: read
concurrency:
  group: plugin-main-release
  cancel-in-progress: false
jobs:
  source:
    name: Pin main release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      source: ${{ steps.select.outputs.source }}
      main: ${{ steps.select.outputs.main }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      published: ${{ steps.select.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: select
        run: ./scripts/release main select ${{ (inputs.exercise_failure || inputs.exercise_hold_seconds != '' && inputs.exercise_hold_seconds != '0') && '--exercise' || '' }} --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/source.json"
      - run: git checkout --detach "${{ steps.select.outputs.source }}"
      - run: ./scripts/release main verify --output "$RUNNER_TEMP/merge-evidence"
        if: steps.select.outputs.published != 'true'
      - run: ./scripts/release main record --source "${{ steps.select.outputs.source }}" --state pending
        if: inputs.exercise_failure != true && steps.select.outputs.published != 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/merge-evidence/
  package:
    name: Package (${{ matrix.target }})
    needs: source
    if: needs.source.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-session-board/checker
            target
          key: release-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ needs.source.outputs.source }}
          restore-keys: |
            release-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            candidate-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path scripts/checker/Cargo.toml
      - run: cargo build --locked --offline --example dev_fixture
      - run: TMPDIR=/tmp ./scripts/release candidate --local --save-only --target "${{ matrix.target }}" --fixture "$PWD/target/debug/examples/dev_fixture" --startup-report "$RUNNER_TEMP/startup/STARTUP.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-startup-${{ matrix.target }}
          path: ${{ runner.temp }}/startup/
  publish:
    name: Publish immutable plugins
    needs: [source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      EXERCISE_FAILURE: ${{ inputs.exercise_failure || false }}
      EXERCISE_HOLD: ${{ inputs.exercise_hold_seconds || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise before publication
        run: |
          case "$EXERCISE_HOLD" in 0|120|300) sleep "$EXERCISE_HOLD";; *) exit 2;; esac
          test "$EXERCISE_FAILURE" != true
      - run: |
          gh auth setup-git
          ./scripts/release candidate --finalize
  result:
    name: Record publication
    if: always()
    needs: [source, package, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.source.outputs.source || github.sha }}
      PUBLISHED: ${{ needs.publish.result }}
      ALREADY_PUBLISHED: ${{ needs.source.outputs.published }}
      SOURCE_RESULT: ${{ needs.source.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      EXERCISE_FAILURE: ${{ inputs.exercise_failure || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          state=failure
          test "$PUBLISHED" != success || state=success
          test "$ALREADY_PUBLISHED" != true || state=success
          exercise=()
          test "$EXERCISE_FAILURE" != true || exercise=(--exercise)
          phase=publish
          test "$PACKAGE_RESULT" != failure || phase=package
          test "$SOURCE_RESULT" != failure || phase=source
          ./scripts/release main record --source "$SOURCE" --state "$state" --phase "$phase" "${exercise[@]}" --output "$RUNNER_TEMP/RELEASE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result
          path: ${{ runner.temp }}/RELEASE.json
