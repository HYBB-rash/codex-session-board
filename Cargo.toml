[package]
name = "codex-session-board"
build = "build.rs"
version = "0.3.54"
edition = "2024"
description = "Local Codex conversation status board"
default-run = "codex-session-board"

[[example]]
name = "project_check"
path = "scripts/project_check.rs"
test = true

[[example]]
name = "remote_parity_lab"
test = true

[[example]]
name = "dev_fixture"
test = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustix = { version = "1", features = ["process", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
tiny_http = "0.12"
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["user", "socket", "event"] }

[dev-dependencies]
ra-ap-rustc_lexer = "=0.183.0"
tempfile = "3"
toml = "=1.1.2"
