[package]
name = "notion-program"
version = "0.1.10"
edition = "2024"
description = "Notion task dispatcher and knowledge archiver"
default-run = "notion-program"

[[bin]]
name = "notion-program-test-server"
path = "tests/support/protocol_server.rs"
test = false
bench = false

[[example]]
name = "project_check"
path = "scripts/project_check.rs"
test = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
lazy-regex = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
ra-ap-rustc_lexer = "=0.183.0"
tempfile = "3"
toml = "=1.1.2"
