{
  "schema_version": 1,
  "template_version": "1.1",
  "project": {
    "id": "codex-session-board",
    "name": "codex-session-board",
    "purpose": "使用 Rust 实现本地 Codex 会话看板，自动发现会话、维护状态与备注并同步原生标题。"
  },
  "profile": "code",
  "locale": {
    "timezone": "Asia/Shanghai",
    "date_policy": "local_calendar"
  },
  "features": {
    "handoffs": true,
    "journal": true,
    "decisions": true,
    "issue_ledger": false,
    "source_rules": true,
    "runtime_config": true
  },
  "paths": {
    "source_roots": [
      "src",
      "tests",
      "assets",
      "acceptance"
    ],
    "config_paths": [
      "Cargo.toml",
      "config.example.json",
      "plugin.json",
      ".codex-plugin/plugin.json",
      "mcp.json",
      ".mcp.json"
    ]
  },
  "verification": {
    "command": "sh scripts/verify_context.sh",
    "ci": false
  },
  "concurrency": {
    "default_mode": "isolated_write",
    "coordinator_owned": [
      "context/STATE.yaml",
      "current_phase",
      "verification",
      "context/journal/",
      "task_registration"
    ],
    "worker_allowed_records": [
      "context/tasks/active/<unique-task-id>.md",
      "context/handoffs/<unique-task-id>.md",
      "context/results/<unique-task-id>.md"
    ]
  },
  "bootstrap": {
    "created_at": "2026-11-06"
  }
}
